[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biosensor-quant"
version = "1.0.0"
description = "Single-cell quantification of ratiometric fluorescent biosensors from Cellpose-segmented yeast microscopy images"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lukas Nutz" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-image>=0.22",
    "imageio>=2.31",
    "tifffile",
    "openpyxl",
]

[project.optional-dependencies]
gpu = ["pyclesperanto-prototype"]
test = ["pytest"]

[project.scripts]
biosensor-quant = "biosensor_quant.cli:main"

[tool.setuptools]
packages = ["biosensor_quant"]
